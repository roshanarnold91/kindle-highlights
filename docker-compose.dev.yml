services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: kindle-highlights-backend-dev
    command: ["python", "app.py"]
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./data-dev:/data
    environment:
      SECRET_KEY: dev-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: devpassword123
      FLASK_ENV: development

  frontend:
    image: node:20-alpine
    container_name: kindle-highlights-frontend-dev
    working_dir: /frontend
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
    depends_on:
      - backend
